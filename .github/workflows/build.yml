name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Vet Code
        run: go vet ./...

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          
          OUTPUT_NAME="PlugLever-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          
          go build -ldflags="-s -w" -o "dist/${OUTPUT_NAME}" ./cmd/pluglever/main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlugLever-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
